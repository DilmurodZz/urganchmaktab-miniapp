<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="1-IMI">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2BE6A"/><stop offset=".5" stop-color="#C9A04A"/><stop offset="1" stop-color="#A47B2C"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3112B"/><stop offset="1" stop-color="#6E0618"/></linearGradient>
  </defs>
  <!-- burgundy outer ring, gold rings, ivory field -->
  <circle cx="60" cy="60" r="58" fill="url(#b)"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="url(#g)" stroke-width="3"/>
  <circle cx="60" cy="60" r="48" fill="#F7F3EE"/>
  <circle cx="60" cy="60" r="44.5" fill="none" stroke="url(#g)" stroke-width="1.2"/>
  <!-- small open book -->
  <g transform="translate(60 33)" fill="none" stroke="#8B0920" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 2.5C-4.5-1-9.5-1.6-14-.4v13c4.5-1.2 9.5-.6 14 2.9 4.5-3.5 9.5-4.1 14-2.9v-13C9.5-1.6 4.5-1 0 2.5z" fill="#F7F3EE"/>
    <path d="M0 2.5v13"/>
  </g>
  <!-- 1-IMI monogram -->
  <text x="60" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="27" letter-spacing="-.5" fill="#1C2E4A">1-IMI</text>
  <!-- gold rule with a dot -->
  <path d="M36 84h18M66 84h18" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="60" cy="84" r="2.2" fill="#8B0920"/>
