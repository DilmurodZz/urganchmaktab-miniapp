name = "urganch-share"
main = "src/index.js"
compatibility_date = "2026-10-01"
# the Cloudflare account that owns this server (pinned, so a login to another account can never deploy here by mistake)
account_id = "e3bd285cf159f89120942e2bbe2aa169"

# The bot token is stored as a secret, never in this file:
#   npx wrangler secret put BOT_TOKEN

[[kv_namespaces]]
binding = "COLORS"
id = "b75cf2d1c7cf4b8fbd2b21b61dfd5158"   # npx wrangler kv namespace create COLORS

# usage statistics and the user list for admin messages
[[d1_databases]]
binding = "DB"
database_name = "urganch-stats"
database_id = "01791776-b9df-4f6a-8764-77a42c99e81b"   # npx wrangler d1 create urganch-stats

[vars]
# Telegram user ids that see the admin section and may use /admin/* (comma separated)
ADMIN_IDS = "5199387523,957578083"
CHANNEL = ""
# Google Meet for mentors: the OAuth client id is public; GOOGLE_CLIENT_SECRET is a secret (npx wrangler secret put GOOGLE_CLIENT_SECRET)
GOOGLE_CLIENT_ID = "67781824351-032j1dui4jkg851ti6hothal7nfea2bp.apps.googleusercontent.com"

# Workers AI: translates the youth news into the reader's language
[ai]
binding = "AI"

# the students' chat room (SQLite-backed Durable Object, works on the free plan)
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# every minute: meeting reminders and the queued bot messages
[triggers]
crons = ["* * * * *"]
